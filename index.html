<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nizam Uddin Shamrat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nizam Uddin Shamrat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ─── Google Font ─────────────────────────────────────────── */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Loader backdrop ─────────────────────────────────────── */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #090e1a;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ─── Logo container ──────────────────────────────────────── */
    .loader-logo {
      width: 72px;
      height: 70px;
      position: relative;
    }

    /* Glow ring behind the logo */
    .loader-logo::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,199,227,0.18) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* ─── Inline SVG path animation ───────────────────────────── */
    .loader-logo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .loader-logo svg path {
      fill: none;
      stroke: #1AC7E3;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4500;
      stroke-dashoffset: 4500;
      animation: draw-path 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: drop-shadow(0 0 8px rgba(26,199,227,0.7));
    }

    @keyframes draw-path {
      to { stroke-dashoffset: 0; }
    }

    /* ─── Glow pulse ──────────────────────────────────────────── */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.15); opacity: 1; }
    }

    /* ─── Loading label ───────────────────────────────────────── */
    .loader-label {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      animation: fade-pulse 1.6s ease-in-out infinite;
    }

    @keyframes fade-pulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.85; }
    }

    /* ─── Progress bar ────────────────────────────────────────── */
    .loader-bar-track {
      width: 140px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1AC7E3, #0af);
      border-radius: 999px;
      animation: bar-fill 2.2s ease forwards;
      box-shadow: 0 0 8px #1AC7E3;
    }

    @keyframes bar-fill {
      0%   { width: 0%; }
      40%  { width: 55%; }
      80%  { width: 85%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       APP-LEVEL LOADER
  ═══════════════════════════════════════════════ -->
  <div id="app-loader" aria-label="Loading application" role="status">

    <!-- Logo with animated stroke drawing -->
    <div class="loader-logo">
      <!--
        Inline SVG so CSS can target the <path> for stroke-dasharray animation.
        fill is overridden to "none" via CSS; stroke is applied instead.
      -->
      <svg width="656" height="640" viewBox="0 0 656 640" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </div>

    <!-- Thin animated progress bar -->
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>

    <!-- Pulsing label -->
    <p class="loader-label">Loading</p>

  </div>
  <!-- ═══════ END LOADER ═══════ -->

  <script>
    /**
     * Dismiss the loader once Flutter has finished mounting.
     * _flutter.loader.load() resolves when the app is interactive.
     */
    window.addEventListener('load', function () {
      var loader = document.getElementById('app-loader');

      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          var appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();

          // Small delay so any first-frame paint is settled before fade-out
          setTimeout(function () {
            loader.classList.add('hidden');
          }, 300);
        }
      });
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Page Not Found | Portfolio</title>
  <meta name="description" content="Redirecting to the main application..." />

  <!-- Open Graph -->
  <meta property="og:title" content="Portfolio of a Lead Flutter Developer" />
  <meta property="og:description"
    content="Expert in building high-performance cross-platform applications for Android & iOS." />
  <meta property="og:image" content="/assets/og-cover.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portfolio of a Lead Flutter Developer" />
  <meta name="twitter:description" content="Expert in Flutter, Clean Architecture & scalable mobile systems." />
  <meta name="twitter:image" content="/assets/og-cover.png" />

  <!-- SPA Redirect Handling -->
  <script>
    // Preserve the full path for Flutter routing
    const redirectTo = window.location.pathname + window.location.search + window.location.hash;

    // Send user back to index with route preserved
    window.location.replace("/?route=" + encodeURIComponent(redirectTo));
  </script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: white;
    }

    .box {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Redirecting…</h1>
    <p>Taking you to the application</p>
  </div>
</body>

</html>
